name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build devhub.slnx --configuration Release -p:Platform=x64

      - name: Test
        run: dotnet test tests/DevHub.Core.Tests/DevHub.Core.Tests.csproj --configuration Release
